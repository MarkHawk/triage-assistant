# How people really describe these problems, mapped to identity-lab runbooks
# (by number). Used by triage/retrieval.py.
#   say:   a phrase that must appear in the ticket, words in order
#   near:  words that must all appear close together, in any order
#   runbooks: {runbook number: weight}; weights add up, capped
#   hint:  a user-side cause. It has no runbook; it stops weak keyword matches
#          from forcing one when nothing stronger agrees.
# Matching ignores case and punctuation and treats simple plurals alike.

# 15 redirect loop
- say: [goes round in circles, round and round, going round in circles, goes in circles, keeps redirecting, keeps reloading, bounces back and forth, redirected you too many times, too many redirects, isn't redirecting properly, not redirecting properly, ping pong]
  near: [[circles, page], [loop, redirect], [bounce, login, again]]
  runbooks: {15: 3.0}
- say: [clearing cookies didn't help, deleting cookies didn't help, cleared cookies and it still, bounces me back to the login]
  runbooks: {15: 1.5}

# 3 redirect URI mismatch
- say: [something about a redirect, says redirect, invalid parameter, invalid redirect, wrong redirect, redirect uri, redirect address]
  runbooks: {3: 2.0, 15: 0.6}
