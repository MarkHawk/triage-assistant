- say: [bookmark, favourites, favorites, old link, old url, saved link, history link, autofill, saved password, browser remembered]
  hint: user-side cause such as an old bookmark or a stale saved link
- say: [new starter, new joiner, no access yet, not set up yet, haven't been given access, need access]
  hint: access request rather than a fault
